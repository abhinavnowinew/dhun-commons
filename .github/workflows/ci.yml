name: ci

on:
  push:
  pull_request:

jobs:
  telegram:
    name: Telegram bridge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        working-directory: telegram
        run: |
          for file in bridge.mjs lib/*.mjs testkit/*.mjs test/*.mjs; do
            node --check "$file"
          done
      - name: Tests
        working-directory: telegram
        run: npm test

  secrets:
    name: Secret guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse committed tokens, keys and wallet material
        run: |
          set -eu
          fail=0
          if git ls-files | grep -E '(^|/)(\.env$|\.env\.[^e]|storage\.json$|roles\.json$|config\.json$)'; then
            echo "::error::Committed environment or wallet file"; fail=1
          fi
          if git grep -n -I -E '[0-9]{8,10}:[A-Za-z0-9_-]{35}' -- . ':!*.lock'; then
            echo "::error::A Telegram bot token pattern is committed"; fail=1
          fi
          if git grep -n -I -E 'AIza[0-9A-Za-z_-]{35}' -- . ':!*.lock'; then
            echo "::error::A Google Maps key pattern is committed"; fail=1
          fi
          exit "$fail"

  module:
    name: Module manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate metadata and relay wiring
        run: |
          set -eu
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("metadata.json", "utf8"));
            if (m.name !== "dhun_commons") throw new Error("unexpected module name: " + m.name);
            const deps = m.dependencies || [];
            if (!Array.isArray(deps)) throw new Error("dependencies must be an array of strings for Basecamp 0.2.3");
            if (!deps.includes("lez_core")) throw new Error("lez_core dependency is missing");
          '
          grep -q 'publishTelegramState' src/dhun_commons.rep
          grep -q 'publishTelegramState' src/dhun_commons_backend.cpp
          grep -q 'publishTelegramState' qml/Main.qml
          grep -q 'readPhotoBase64' src/dhun_commons.rep
          grep -q 'readPhotoBase64' src/dhun_commons_backend.cpp
          test -f qml/Main.qml
          test -f qml/kitchen.js
          test -f qml/pages/Kitchen.qml
          test -f qml/assets/menu-sample.jpg
          grep -q '"kitchen"' qml/Main.qml
          test -f tests/Flow.qml
          test -f docs/KITCHEN.md
          test -f docs/PUBLISHING.md
          test -f qml/agro.js
          test -f qml/pages/Agro.qml
          test -f docs/AGRO.md
          grep -q 'agroForecast' src/dhun_commons.rep
          grep -q 'agroForecast' src/dhun_commons_backend.cpp
          grep -q '"agro"' qml/Main.qml
          test -f qml/civic.js
          test -f qml/pages/Civic.qml
          test -f docs/CIVIC.md
          grep -q '"civic"' qml/Main.qml
          grep -q 'civic' qml/components/Sidebar.qml
          grep -q 'function balanceLoads' qml/civic.js
          grep -q 'CREW INTERPLAY' qml/pages/Civic.qml

  catalog:
    name: Catalog generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check scripts/make-catalog.mjs
      - name: Validate published catalog, when present
        run: |
          if [ -f catalog/index.json ]; then
            node scripts/make-catalog.mjs --check catalog
          else
            echo "No catalog/index.json yet; release steps are in docs/PUBLISHING.md."
          fi
